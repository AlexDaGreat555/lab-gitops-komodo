name: lab04

services:
  lab04-service:
    image: REPLACE_WITH_VERSION_1_IMAGE
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - python
      - -c
      - |
        import os
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        versions = {
            "3.13.7": b"lab04 version 1",
            "3.13.8": b"lab04 version 2",
        }
        body = versions[os.environ["PYTHON_VERSION"]]

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path not in ("/health", "/version"):
                    self.send_error(404)
                    return
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, format, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 1s
